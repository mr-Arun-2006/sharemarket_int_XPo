name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://localhost:27017/test
      JWT_SECRET: ci-test-secret-012345678901234567890123456
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Validate production configuration
        working-directory: backend
        env:
          APP_ENV: production
          AUTH_COOKIE_SECURE: "true"
          AUTH_COOKIE_SAMESITE: none
          CORS_ORIGINS: https://frontend.example.com
          ALLOWED_HOSTS: api.example.com
          DOCS_ENABLED: "false"
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: ci-user
          SMTP_PASSWORD: ci-password
          SMTP_FROM: ci@example.com
          SMTP_USE_TLS: "true"
        run: python -c "from app.main import app; print(app.title, app.version)"
      - name: Import application
        working-directory: backend
        run: python -c "from app.main import app; print(app.title, app.version)"
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Build backend production image
        run: docker build --tag sharem-int-xpo-backend:ci backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
